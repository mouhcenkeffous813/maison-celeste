<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="25%" stop-color="#F7EFE8" />
      <stop offset="50%" stop-color="#EBE0D3" />
      <stop offset="75%" stop-color="#F4ECE4" />
      <stop offset="100%" stop-color="#E5D6C5" />
    </linearGradient>
    <linearGradient id="silkWave" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D9C3B0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A4A42" />
      <stop offset="50%" stop-color="#7B6152" />
      <stop offset="100%" stop-color="#4A3B34" />
    </linearGradient>
  </defs>

  <!-- Background with rounded square -->
  <rect width="200" height="200" rx="36" fill="url(#silkBg)" />

  <!-- Silk fabric wave curves for organic luxury texture -->
  <path d="M0 60 C 60 40, 140 90, 200 70 L 200 130 C 130 160, 70 110, 0 140 Z" fill="url(#silkWave)" />
  <path d="M0 110 C 70 140, 130 90, 200 120 L 200 200 L 0 200 Z" fill="#EADCCF" opacity="0.3" />

  <!-- Subtle gold border -->
  <rect x="6" y="6" width="188" height="188" rx="30" stroke="#D8C2B0" stroke-width="2" stroke-opacity="0.6" fill="none" />

  <!-- Brand Typography -->
  <text x="100" y="105" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="30" 
        font-weight="700" 
        letter-spacing="5" 
        fill="url(#goldText)" 
        text-anchor="middle">ÔRLÉA</text>
  
  <text x="100" y="130" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#8E7869" 
        text-anchor="middle">JEWELRY</text>
  
  <!-- Tiny decorative diamond or star on top -->
  <circle cx="100" cy="65" r="2.5" fill="#B39274" />
</svg>
