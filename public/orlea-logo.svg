<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="celesteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="35%" stop-color="#F9F3EC" />
      <stop offset="70%" stop-color="#F1E5D8" />
      <stop offset="100%" stop-color="#E5D3BF" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7B56" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#7C5D39" />
    </linearGradient>
    <linearGradient id="silkWave" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#DFC8B5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Luxury Background with rounded rectangle -->
  <rect width="200" height="200" rx="40" fill="url(#celesteBg)" />

  <!-- Silk fabric wave curves for organic luxury texture -->
  <path d="M0 65 C 60 45, 140 95, 200 75 L 200 135 C 130 165, 70 115, 0 145 Z" fill="url(#silkWave)" />
  <path d="M0 115 C 70 145, 130 95, 200 125 L 200 200 L 0 200 Z" fill="#EADBCB" opacity="0.4" />

  <!-- Subtle gold frame -->
  <rect x="8" y="8" width="184" height="184" rx="32" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Celestial Star Icon -->
  <g transform="translate(100, 58)">
    <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="url(#goldGradient)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="100" y="104" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="4" 
        fill="url(#goldGradient)" 
        text-anchor="middle">MAISON</text>
  
  <text x="100" y="128" 
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
        font-size="21" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#3A2E28" 
        text-anchor="middle">CÉLESTE</text>
  
  <text x="100" y="148" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-size="8.5" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#8E7869" 
        text-anchor="middle">HAUTE JOAILLERIE</text>
</svg>
